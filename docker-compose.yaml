# Local one-command stack: PostgreSQL + Spring Boot API + Vite/React UI.
#
#   docker compose up --build
#
# - UI:      http://localhost:5173  (nginx proxies /api -> backend:8080)
# - API:     http://localhost:8080/api/v1
# - Postgres: localhost:5432 (jobhelper/jobhelper) — remove the port mapping
#   if you already run a local Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhelper
      POSTGRES_USER: jobhelper
      POSTGRES_PASSWORD: jobhelper
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhelper -d jobhelper"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./jobAssitant/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jobhelper
      SPRING_DATASOURCE_USERNAME: jobhelper
      SPRING_DATASOURCE_PASSWORD: jobhelper
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./jobAssitant/frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
