# CI: verify backend tests, frontend lint/build on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobAssitant/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobhelper
          POSTGRES_USER: jobhelper
          POSTGRES_PASSWORD: jobhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhelper -d jobhelper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobhelper
          SPRING_DATASOURCE_USERNAME: jobhelper
          SPRING_DATASOURCE_PASSWORD: jobhelper
          JOBHELPER_JWT_SECRET: ci-test-secret-that-is-long-enough-32chars
        run: ./mvnw -B test

      - name: Package (smoke)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobhelper
          SPRING_DATASOURCE_USERNAME: jobhelper
          SPRING_DATASOURCE_PASSWORD: jobhelper
          JOBHELPER_JWT_SECRET: ci-test-secret-that-is-long-enough-32chars
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobAssitant/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobAssitant/frontend/package-lock.json

      # package-lock is temporarily out of sync; use npm install until lock is fixed.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build
