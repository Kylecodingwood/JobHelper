# CD: trigger Render deployments after CI passes on main.
#
# Required GitHub Secrets:
#   RENDER_BACKEND_DEPLOY_HOOK  — from Render dashboard > backend service > Settings > Deploy Hook
#   RENDER_FRONTEND_DEPLOY_HOOK — from Render dashboard > frontend service > Settings > Deploy Hook
#
# Render builds from source directly; the deploy hook just tells it to re-pull and rebuild.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deployments
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Deploy backend
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: curl -fsSL "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        run: curl -fsSL "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
